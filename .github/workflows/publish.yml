# Release workflow for the Angular components (npm `@lockally/angular`).
#
# TEMPLATE — inert in this monorepo. Copied to `.github/workflows/publish.yml` in
# github.com/lockallyinc/lockally-angular by publish-sdk-repos.sh. Tag-driven: push `vX.Y.Z`.
#
# Angular libraries build with ng-packagr into ./dist (which contains its own
# publishable package.json), so we publish THAT directory, not the repo root.
#
# One-time setup: add repo secret NPM_TOKEN (an @lockally-scoped automation token).
name: Publish npm

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write   # npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - run: npm publish ./dist --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
